<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Tower Command | Anomaly Engine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #f8fafc, #e2e8f0);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 28px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }
        .critical-border { border-top: 5px solid #ef4444; }
        .warning-border { border-top: 5px solid #f59e0b; }
        .stable-border { border-top: 5px solid #10b981; }

        .btn-remediate {
            background: #000;
            color: #fff;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 8px 16px;
            transition: all 0.2s;
        }
        .btn-remediate:hover {
            background: #333;
            transform: scale(1.02);
        }
        .pulse-dot {
            height: 8px;
            width: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
            <div>
                <h1 class="text-3xl font-light tracking-tight text-slate-900">Tower<span class="font-bold text-blue-600">Command</span></h1>
                <p class="text-slate-500 text-sm">Unified Anomaly Detection & <span class="text-slate-800 font-medium">One-Click Remediation</span></p>
            </div>
            <div class="flex items-center space-x-4">
                <div class="glass-card px-4 py-2 flex items-center space-x-3 shadow-sm">
                    <span class="pulse-dot"></span>
                    <span class="text-xs font-bold text-slate-600 uppercase tracking-widest">Elastic ML Sync: Live</span>
                </div>
                <button class="btn btn-dark rounded-pill px-4 py-2 text-xs">Executive Report</button>
            </div>
        </header>

        <div class="row g-4" id="tower-grid">
            </div>

        <footer class="mt-12">
            <div class="glass-card p-6 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h5 class="text-sm font-bold text-slate-800 uppercase tracking-widest">Audit Trail (Remediation Actions)</h5>
                    <span class="text-xs text-slate-400">Compliance & History</span>
                </div>
                <div id="audit-log" class="text-xs space-y-2 text-slate-600">
                    <div class="p-2 border-b border-white/40 italic">System ready. Awaiting anomalies...</div>
                </div>
            </div>
        </footer>
    </div>

    <script>
        const TOWERS = [
            { id: 'unix', name: 'UNIX/Linux', icon: '', metric: 'CPU Load' },
            { id: 'windows', name: 'Windows', icon: '🪟', metric: 'Memory' },
            { id: 'middleware', name: 'Middleware', icon: '⚙️', metric: 'Heap' },
            { id: 'db', name: 'Database', icon: '🗄️', metric: 'I/O Wait' },
            { id: 'storage', name: 'Storage', icon: '💾', metric: 'Latency' },
            { id: 'backup', name: 'Backup', icon: '☁️', metric: 'Failure Rate' }
        ];

        const charts = {};

        function createCards() {
            const grid = document.getElementById('tower-grid');
            TOWERS.forEach(tower => {
                const col = document.createElement('div');
                col.className = 'col-12 col-md-6 col-lg-4';
                col.innerHTML = `
                    <div id="card-${tower.id}" class="glass-card p-6 stable-border">
                        <div class="flex justify-between items-center mb-4">
                            <div class="flex items-center space-x-2">
                                <span class="text-xl">${tower.icon}</span>
                                <span class="font-semibold text-slate-800">${tower.name}</span>
                            </div>
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">${tower.metric}</span>
                        </div>

                        <div class="flex justify-between items-end mb-4">
                            <div>
                                <div id="score-${tower.id}" class="text-4xl font-light text-slate-900 tracking-tighter">0.0</div>
                                <div class="text-[10px] text-slate-400 uppercase font-bold">Anomaly Score</div>
                            </div>
                            <div class="text-right">
                                <div id="actual-${tower.id}" class="text-lg font-medium text-slate-700">--</div>
                                <div class="text-[10px] text-slate-400 font-bold">Actual Value</div>
                            </div>
                        </div>

                        <div class="h-16 w-full mb-4">
                            <canvas id="chart-${tower.id}"></canvas>
                        </div>

                        <div id="action-zone-${tower.id}" class="mt-4 pt-4 border-t border-white/50 opacity-30 pointer-events-none transition-all duration-500">
                            <div class="flex gap-2">
                                <button onclick="remediate('${tower.id}')" class="btn-remediate flex-grow">REMEDIATE</button>
                                <button class="btn btn-outline-dark border-0 text-[10px] font-bold p-0 px-2">LOGS</button>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(col);
                initChart(tower.id);
            });
        }

        function initChart(id) {
            const ctx = document.getElementById(`chart-${id}`).getContext('2d');
            charts[id] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(15).fill(''),
                    datasets: [{
                        data: Array(15).fill(20),
                        borderColor: '#94a3b8',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.4,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { display: false }, y: { display: false, min: 0, max: 100 } }
                }
            });
        }

        function updateData() {
            TOWERS.forEach(tower => {
                // Simulation: In production, fetch actual score from Elastic ML results
                const isAnomaly = Math.random() > 0.85;
                const score = isAnomaly ? (Math.random() * 60 + 40) : (Math.random() * 8);
                const actual = isAnomaly ? (80 + Math.random() * 20).toFixed(1) : (30 + Math.random() * 10).toFixed(1);

                // UI Updates
                const scoreEl = document.getElementById(`score-${tower.id}`);
                const actualEl = document.getElementById(`actual-${tower.id}`);
                const card = document.getElementById(`card-${tower.id}`);
                const actionZone = document.getElementById(`action-zone-${tower.id}`);

                scoreEl.innerText = score.toFixed(1);
                actualEl.innerText = actual;

                // Dynamic Severity Styling
                card.classList.remove('stable-border', 'warning-border', 'critical-border');
                let chartColor = '#94a3b8';

                if (score >= 75) {
                    card.classList.add('critical-border');
                    actionZone.classList.remove('opacity-30', 'pointer-events-none');
                    chartColor = '#ef4444';
                } else if (score >= 25) {
                    card.classList.add('warning-border');
                    actionZone.classList.add('opacity-30', 'pointer-events-none');
                    chartColor = '#f59e0b';
                } else {
                    card.classList.add('stable-border');
                    actionZone.classList.add('opacity-30', 'pointer-events-none');
                    chartColor = '#10b981';
                }

                // Update Chart
                const chart = charts[tower.id];
                chart.data.datasets[0].data.shift();
                chart.data.datasets[0].data.push(score);
                chart.data.datasets[0].borderColor = chartColor;
                chart.update('none');
            });
        }

        function remediate(towerId) {
            const tower = TOWERS.find(t => t.id === towerId);
            const log = document.getElementById('audit-log');
            const timestamp = new Date().toLocaleTimeString();
            
            // Add entry to audit log (Selling point: The history Elastic doesn't track)
            const entry = document.createElement('div');
            entry.className = 'p-2 border-b border-white/40 flex justify-between';
            entry.innerHTML = `
                <span><b class="text-blue-600">ACTION:</b> Script triggered for <b>${tower.name}</b> Tower.</span>
                <span class="text-slate-400 font-mono">${timestamp}</span>
            `;
            log.prepend(entry);
            
            alert(`Triggering automated remediation script for ${tower.name} Tower. Root cause analysis being generated...`);
        }

        createCards();
        setInterval(updateData, 5000); // 5-second polling
        updateData();
    </script>
</body>
</html>
