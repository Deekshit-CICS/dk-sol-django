<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1d1d1f;
            padding: 40px 0;
        }
        .apple-card {
            background: #ffffff;
            border-radius: 18px;
            border: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            padding: 30px;
        }
        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #86868b;
        }
        .form-control {
            border-radius: 10px;
            border: 1px solid #d2d2d7;
            padding: 12px;
            background-color: #fbfbfd;
        }
        .form-control:focus {
            border-color: #0071e3;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
            background-color: #fff;
        }
        .btn-apple {
            background-color: #0071e3;
            color: white;
            border-radius: 20px;
            padding: 10px 25px;
            font-weight: 500;
            border: none;
            transition: all 0.2s;
        }
        .btn-apple:hover {
            background-color: #0077ed;
            transform: scale(1.02);
        }
        .table-container {
            margin-top: 40px;
        }
        .table {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border-collapse: separate;
            border-spacing: 0;
        }
        .table thead {
            background-color: #f5f5f7;
        }
        .table th {
            border-bottom: 1px solid #d2d2d7;
            font-weight: 600;
            color: #86868b;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            
            <div class="apple-card">
                <h2 class="mb-4 text-center fw-bold">Service Request</h2>
                <form>
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label">SNOW Ticket Number</label>
                            <input type="text" class="form-control" placeholder="REQ0000000">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email Notification</label>
                            <input type="email" class="form-control" placeholder="admin@example.com">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Target Hosts</label>
                            <textarea class="form-control" rows="4" placeholder="Enter one host per line..."></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Destination</label>
                            <textarea class="form-control" rows="4" placeholder="Enter destination details..."></textarea>
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Port Number</label>
                            <textarea class="form-control" rows="3" placeholder="Enter ports (e.g. 80, 443, 8080)"></textarea>
                        </div>
                    </div>

                    <div class="text-center mt-5">
                        <button type="submit" class="btn btn-apple px-5">Submit Request</button>
                    </div>
                </form>
            </div>

            <div class="table-container">
                <h4 class="mb-3 fw-bold">Recent Results</h4>
                <div class="table-responsive apple-card p-0">
                    <table class="table mb-0">
                        <thead>
                            <tr>
                                <th class="p-3">Source Host</th>
                                <th class="p-3">Destination Host</th>
                                <th class="p-3">Port</th>
                                <th class="p-3">Status</th>
                                <th class="p-3">Result</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="p-3">10.0.0.1</td>
                                <td class="p-3">192.168.1.50</td>
                                <td class="p-3">443</td>
                                <td class="p-3"><span class="badge bg-success-subtle text-success">Success</span></td>
                                <td class="p-3">Connection established</td>
                            </tr>
                            <tr>
                                <td class="p-3">10.0.0.2</td>
                                <td class="p-3">192.168.1.55</td>
                                <td class="p-3">80</td>
                                <td class="p-3"><span class="badge bg-danger-subtle text-danger">Failed</span></td>
                                <td class="p-3">Timeout after 30s</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
