<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Tower Command | Resource Intelligence</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #1e293b; }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        .tower-section { margin-bottom: 3rem; padding: 2rem; border-radius: 30px; background: rgba(255,255,255,0.3); }
        .anomaly-pulse { border: 2px solid #ef4444 !important; animation: pulse-shadow 2s infinite; }
        @keyframes pulse-shadow {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .metric-value { font-size: 1.75rem; font-weight: 300; letter-spacing: -1px; }
        .sidebar-nav { position: fixed; left: 0; top: 0; bottom: 0; width: 80px; background: #0f172a; display: flex; flex-direction: column; align-items: center; padding-top: 2rem; z-index: 1000; }
        .nav-icon { color: #64748b; margin-bottom: 2rem; cursor: pointer; transition: 0.2s; }
        .nav-icon:hover { color: #fff; }
        main { margin-left: 80px; }
    </style>
</head>
<body>

    <div class="sidebar-nav shadow-xl">
        <div class="nav-icon text-white font-bold text-xl">TC</div>
        <a href="#unix-section" class="nav-icon" title="Unix"></a>
        <a href="#win-section" class="nav-icon" title="Windows">⊞</a>
        <a href="#db-section" class="nav-icon" title="Database">🗄</a>
        <a href="#mw-section" class="nav-icon" title="Middleware">⚙︎</a>
    </div>

    <main class="p-8">
        <header class="mb-10 flex justify-between items-end">
            <div>
                <h1 class="text-4xl font-light tracking-tighter">Tower<span class="font-bold text-blue-600">Intelligence</span></h1>
                <p class="text-slate-500">Cross-Tower Resource Monitoring & Elastic ML Diagnostics</p>
            </div>
            <div class="text-right text-xs font-mono text-slate-400">
                LATEST_SYNC: <span id="sync-time">--:--:--</span>
            </div>
        </header>

        <section id="unix-section" class="tower-section">
            <div class="flex items-center space-x-4 mb-6">
                <span class="text-3xl"></span>
                <h2 class="text-2xl font-semibold">Unix / Linux Infrastructure</h2>
                <span class="badge bg-slate-200 text-slate-600 rounded-pill px-3">Cluster: Prod-Alpha</span>
            </div>
            <div class="row g-4" id="unix-grid">
                </div>
        </section>

        <section id="db-section" class="tower-section">
            <div class="flex items-center space-x-4 mb-6">
                <span class="text-3xl">🗄</span>
                <h2 class="text-2xl font-semibold">Database Tower</h2>
                <span class="badge bg-slate-200 text-slate-600 rounded-pill px-3">Engines: Oracle, Postgres</span>
            </div>
            <div class="row g-4" id="db-grid">
                </div>
        </section>

        <div class="glass-card p-6 mt-10">
            <h3 class="text-sm font-bold uppercase tracking-widest mb-4">Central Remediation Log</h3>
            <div id="remediation-log" class="text-xs font-mono text-slate-500 max-h-40 overflow-y-auto">
                > System initialized. Awaiting Elastic ML signals...
            </div>
        </div>
    </main>

    <script>
        const TOWER_DATA = {
            unix: [
                { id: 'u_cpu', name: 'CPU Utilization', unit: '%' },
                { id: 'u_mem', name: 'Memory Swap', unit: 'GB' },
                { id: 'u_disk', name: 'Disk I/O Wait', unit: 'ms' },
                { id: 'u_net', name: 'Network Ingress', unit: 'Gbps' }
            ],
            db: [
                { id: 'd_lat', name: 'Query Latency', unit: 'ms' },
                { id: 'd_conn', name: 'Active Sessions', unit: 'cnt' },
                { id: 'd_lock', name: 'Table Locks', unit: 'dur' },
                { id: 'd_buf', name: 'Cache Hit Ratio', unit: '%' }
            ]
        };

        const charts = {};

        function buildGrids() {
            Object.keys(TOWER_DATA).forEach(towerKey => {
                const grid = document.getElementById(`${towerKey}-grid`);
                TOWER_DATA[towerKey].forEach(resource => {
                    const col = document.createElement('div');
                    col.className = 'col-md-3';
                    col.innerHTML = `
                        <div id="card-${resource.id}" class="glass-card p-5 h-100 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">${resource.name}</h4>
                                    <span id="score-${resource.id}" class="text-[10px] font-bold px-2 py-1 rounded bg-slate-100">0.0</span>
                                </div>
                                <div class="metric-value" id="val-${resource.id}">--</div>
                                <div class="text-[10px] text-slate-400 mb-4">Actual vs Typical Variance</div>
                            </div>
                            
                            <div class="h-12 w-full mb-4">
                                <canvas id="chart-${resource.id}"></canvas>
                            </div>

                            <div id="actions-${resource.id}" class="hidden">
                                <button onclick="remediate('${resource.id}', '${resource.name}')" class="w-full py-2 bg-red-600 text-white text-[10px] font-bold rounded-lg hover:bg-red-700 transition">
                                    TRIGGER RECOVERY
                                </button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(col);
                    initChart(resource.id);
                });
            });
        }

        function initChart(id) {
            const ctx = document.getElementById(`chart-${id}`).getContext('2d');
            charts[id] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(10).fill(''),
                    datasets: [{ data: Array(10).fill(0), borderColor: '#94a3b8', borderWidth: 2, pointRadius: 0, tension: 0.4 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
            });
        }

        function simulateUpdate() {
            document.getElementById('sync-time').innerText = new Date().toLocaleTimeString();
            
            Object.values(TOWER_DATA).flat().forEach(res => {
                const isAnomaly = Math.random() > 0.92;
                const score = isAnomaly ? (Math.random() * 50 + 50) : (Math.random() * 10);
                const val = (Math.random() * 100).toFixed(1);

                const card = document.getElementById(`card-${res.id}`);
                const scoreEl = document.getElementById(`score-${res.id}`);
                const valEl = document.getElementById(`val-${res.id}`);
                const actionBox = document.getElementById(`actions-${res.id}`);

                scoreEl.innerText = score.toFixed(1);
                valEl.innerText = `${val}${res.unit}`;

                // SELLING POINT: Real-time UI logic based on Elastic Anomaly Score
                if (score > 75) {
                    card.classList.add('anomaly-pulse');
                    scoreEl.className = 'text-[10px] font-bold px-2 py-1 rounded bg-red-500 text-white';
                    actionBox.classList.remove('hidden');
                } else {
                    card.classList.remove('anomaly-pulse');
                    scoreEl.className = 'text-[10px] font-bold px-2 py-1 rounded bg-slate-100 text-slate-500';
                    actionBox.classList.add('hidden');
                }

                const chart = charts[res.id];
                chart.data.datasets[0].data.shift();
                chart.data.datasets[0].data.push(score);
                chart.update('none');
            });
        }

        function remediate(id, name) {
            const log = document.getElementById('remediation-log');
            const time = new Date().toLocaleTimeString();
            log.innerHTML += `<div class="text-red-500 mt-1">[${time}] CRITICAL: Manual remediation triggered for ${name} (ID: ${id})</div>`;
            log.innerHTML += `<div class="text-blue-500 mt-1">[${time}] EXEC: Calling Ansible API... Job #7721 started.</div>`;
            alert(`Automated Fix initiated for ${name}. Track progress in the Audit Log.`);
        }

        buildGrids();
        setInterval(simulateUpdate, 4000);
        simulateUpdate();
    </script>
</body>
</html>
