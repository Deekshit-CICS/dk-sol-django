<!--
  AI Assistant popup — "Ops Console / Incident Copilot" chat window.

  This file is a TEMPLATE, not a page you open directly. It's fetched at
  runtime by renderAiAssistantWindow() in forensic-rca-live.html, which
  replaces six placeholder tokens (search this file for "AI_POPUP_" to
  find them, inside the <script> block) with real values for the current
  incident/session, then writes the result into the popup window via
  document.write(). Opening this file directly in a browser will just
  show the placeholder tokens literally instead of real data — that's
  expected, it's not meant to be a working page on its own.

  IMPORTANT: this comment deliberately does NOT spell out the placeholder
  tokens verbatim (e.g. with both leading/trailing underscore pairs) —
  renderAiAssistantWindow() substitutes them via String.replace(token, fn),
  which only replaces the FIRST occurrence of an exact string match. If
  this comment repeated a token's exact text above the real one in the
  <script> block, substitution would silently replace the token here
  instead of the real one — which is exactly the bug that shipped in an
  earlier version of this file. Keep it that way if you edit this comment.

  Placeholder purposes (five wrapped in "quotes" already in the template;
  the context-summary one is NOT quoted, since it needs to be a real JS
  object literal like {"incidentId":"INC1006",...}, not a quoted string):
    demo mode flag           -> the literal boolean true/false
    chat endpoint URL        -> quoted string
    feedback endpoint URL    -> quoted string
    CSRF bootstrap URL       -> quoted string
    initial prompt text      -> quoted string
    context summary object   -> UNQUOTED raw JSON object literal

  See renderAiAssistantWindow() for exactly how substitution happens —
  it uses replacer FUNCTIONS (not plain strings) to avoid a real footgun:
  String.prototype.replace() treats "$" specially in a string replacement
  (e.g. "$&", "$1"), so if any incident description or prompt text ever
  contains a literal "$", a naive .replace(token, jsonValue) would corrupt
  the output silently. A function replacer sidesteps that entirely.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops Console — Incident Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --apple-bg: #f5f5f7; --glass: rgba(255,255,255,0.9);
  --blue: #0071e3; --blue-bg: rgba(0,113,227,0.08);
  --green: #28cd41; --green-bg: rgba(40,205,65,0.08);
  --red: #ff3b30; --red-bg: rgba(255,59,48,0.08);
  --amber: #ff9f0a; --amber-bg: rgba(255,159,10,0.08);
  --text-main: #1d1d1f; --text-sec: #6e6e73;
  --border: rgba(0,0,0,0.08);
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
body { margin:0; display:flex; height:100vh; font-family:var(--font-sans); color:var(--text-main); background:linear-gradient(135deg, #f5f5f7 0%, #ffffff 100%); font-size:14px; }
.nav-sidebar { width:212px; background:#fff; border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; color:var(--text-sec); }
.nav-brand { display:flex; align-items:center; gap:10px; padding:18px 18px 14px; border-bottom:1px solid var(--border); }
.nav-brand-mark { width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg, var(--blue), #34aadc); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.nav-brand-mark svg { width:15px; height:15px; }
.nav-brand-text { font-size:13px; font-weight:600; color:var(--text-main); line-height:1.3; }
.nav-brand-sub { font-size:10px; color:var(--text-sec); }
.nav-section { padding:14px 12px 4px; font-size:9.5px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase; color:var(--text-sec); }
.nav-item { display:flex; align-items:center; gap:9px; padding:7px 12px; margin:1px 8px; border-radius:8px; font-size:12.5px; font-weight:500; cursor:default; color:var(--text-sec); }
.nav-item svg { width:14px; height:14px; flex-shrink:0; opacity:0.75; }
.nav-item.active { background:var(--blue-bg); color:var(--blue); }
.nav-item.active svg { opacity:1; }
.nav-spacer { flex:1; }
.nav-footer { display:flex; align-items:center; gap:10px; padding:13px 15px; border-top:1px solid var(--border); }
.avatar { width:24px; height:24px; border-radius:50%; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; flex-shrink:0; }
.nav-footer-name { font-size:12px; font-weight:600; color:var(--text-main); }
.nav-footer-role { font-size:10px; color:var(--text-sec); }
.main-workspace { flex:1; display:flex; flex-direction:column; min-width:0; }
.top-bar { height:52px; padding:0 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; background:#fff; flex-shrink:0; }
.breadcrumb { font-size:12.5px; color:var(--text-sec); display:flex; align-items:center; gap:6px; }
.breadcrumb strong { color:var(--text-main); font-weight:600; }
.route-indicator { display:flex; align-items:center; gap:7px; font-size:11.5px; font-weight:600; padding:6px 12px; border-radius:8px; border:1px solid var(--border); }
.route-indicator.mcp { color:var(--text-sec); background:rgba(0,0,0,0.03); border-color:var(--border); }
.route-indicator.langgraph { color:var(--blue); background:var(--blue-bg); border-color:rgba(0,113,227,0.25); }
.route-dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
.chat-view { flex:1; padding:24px 7%; overflow-y:auto; }
.exchange { margin-bottom:28px; max-width:100%; }
.msg-row { display:flex; margin-bottom:4px; }
.msg-row.user { justify-content:flex-end; }
.bubble-user { background:var(--blue); color:#fff; border-radius:16px 16px 4px 16px; padding:10px 15px; font-size:13.5px; max-width:80%; white-space:pre-wrap; }
.msg-meta { font-size:11px; color:var(--text-sec); margin-top:4px; text-align:right; }
.assistant-block { margin-top:14px; }
.assistant-block > * + * { margin-top:12px; }
.tool-chip { display:inline-flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--border); border-radius:10px; padding:6px 12px; font-size:11.5px; font-family:var(--font-mono); color:var(--text-sec); }
.tool-chip .dot { width:6px; height:6px; border-radius:50%; background:var(--blue); flex-shrink:0; }
.card { border:1px solid var(--border); border-radius:16px; background:#fff; overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,0.03); }
.card-header { padding:13px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:10px; }
.card-id { font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--text-main); }
.card-body { padding:15px 16px; }
.card-desc { font-size:13.5px; margin-bottom:14px; color:var(--text-main); line-height:1.5; }
.field-grid { display:grid; grid-template-columns:1fr 1fr; gap:13px 22px; }
.field-label { font-size:9.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-sec); font-weight:700; margin-bottom:4px; }
.field-value { font-size:12.5px; color:var(--text-main); font-weight:500; }
.pill { display:inline-block; font-size:10px; font-weight:700; padding:3px 9px; border-radius:20px; letter-spacing:0.2px; }
.pill.p1 { background:var(--red-bg); color:var(--red); border:1px solid rgba(255,59,48,0.25); }
.pill.p2 { background:var(--amber-bg); color:var(--amber); border:1px solid rgba(255,159,10,0.25); }
.pill.progress { background:var(--blue-bg); color:var(--blue); border:1px solid rgba(0,113,227,0.25); }
.pill.done { background:var(--green-bg); color:var(--green); border:1px solid rgba(40,205,65,0.25); }
.trace { border:1px solid var(--border); border-radius:16px; background:#fff; overflow:hidden; }
.trace-step { display:flex; align-items:center; gap:10px; padding:9px 16px; font-size:12px; border-bottom:1px solid var(--border); }
.trace-step:last-child { border-bottom:none; }
.trace-step .check { width:15px; height:15px; border-radius:50%; background:var(--green-bg); border:1px solid rgba(40,205,65,0.3); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.trace-step .check svg { width:8px; height:8px; }
.trace-step .label { font-weight:600; color:var(--text-main); }
.thinking-chip { display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--text-sec); font-style:italic; }
.thinking-chip .pulse { width:6px; height:6px; border-radius:50%; background:var(--blue); animation:pulse 1s infinite ease-in-out; }
@keyframes pulse { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
.suggestion-row { display:flex; gap:8px; margin:0 7% 10px; flex-wrap:wrap; }
.suggestion-chip { font-size:11.5px; padding:6px 12px; border-radius:20px; border:1px solid var(--border); color:var(--text-sec); cursor:pointer; background:#fff; font-family:var(--font-mono); }
.suggestion-chip:hover { border-color:var(--blue); color:var(--blue); }
.command-bar { margin:0 7% 20px; border:1px solid var(--border); border-radius:14px; background:#fff; display:flex; align-items:center; padding:4px 6px 4px 14px; box-shadow:0 1px 2px rgba(15,23,42,0.04); }
.command-bar input { flex:1; border:none; outline:none; font-size:13px; padding:9px 0; font-family:var(--font-sans); }
.command-bar-send { width:30px; height:30px; border-radius:10px; background:var(--blue); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.command-bar-send:disabled { opacity:0.5; cursor:default; }
.command-bar-send svg { width:13px; height:13px; color:#fff; }
.fb-row { display:flex; align-items:center; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }
.fb-btn { border:none; background:rgba(0,0,0,0.04); width:26px; height:26px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-sec); transition:0.2s; }
.fb-btn:hover { background:rgba(0,0,0,0.08); }
.fb-btn.active-like { background:var(--green-bg); color:var(--green); }
.fb-btn.active-dislike { background:var(--red-bg); color:var(--red); }
</style>
</head>
<body>
<div class="nav-sidebar">
  <div class="nav-brand">
    <div class="nav-brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
    <div><div class="nav-brand-text">Ops Console</div><div class="nav-brand-sub">Incident Copilot</div></div>
  </div>
  <div class="nav-section">Workspace</div>
  <div class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg> Incident copilot</div>
  <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg> Triage agent</div>
  <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg> Run history</div>
  <div class="nav-spacer"></div>
  <div class="nav-footer"><div class="avatar" id="userAvatar">AI</div><div><div class="nav-footer-name">Incident Copilot</div><div class="nav-footer-role">Context-aware session</div></div></div>
</div>
<div class="main-workspace">
  <div class="top-bar">
    <div class="breadcrumb">Ops Console <span>/</span> <strong id="breadcrumbId">Incident Copilot</strong></div>
    <div class="route-indicator mcp" id="routeBadge"><span class="route-dot"></span><span id="routeBadgeText">Ready</span></div>
  </div>
  <div class="chat-view" id="log"></div>
  <div class="suggestion-row">
    <div class="suggestion-chip" onclick="askSuggestion(this)">Explain the root cause in more detail</div>
    <div class="suggestion-chip" onclick="askSuggestion(this)">Suggest the next remediation step</div>
    <div class="suggestion-chip" onclick="askSuggestion(this)">Any similar past incidents?</div>
  </div>
  <form class="command-bar" id="chatForm">
    <input id="chatInput" type="text" placeholder="Ask a follow-up question…" autocomplete="off">
    <button type="submit" class="command-bar-send" id="sendBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
</div>
<script>
  var DEMO_MODE = __AI_POPUP_DEMO_MODE__;
  var CHAT_URL = "__AI_POPUP_CHAT_URL__";
  var FEEDBACK_URL = "__AI_POPUP_FEEDBACK_URL__";
  var CSRF_BOOTSTRAP_URL = "__AI_POPUP_CSRF_BOOTSTRAP_URL__";
  var initialPrompt = "__AI_POPUP_INITIAL_PROMPT__";
  var contextSummary = __AI_POPUP_CONTEXT_SUMMARY__;
  var chatHistory = [];
  var logEl = document.getElementById("log");
  document.getElementById("breadcrumbId").textContent = contextSummary.incidentId || "Incident Copilot";
  function esc(s) {
    var d = document.createElement("div");
    d.textContent = (s === null || s === undefined) ? "" : String(s);
    return d.innerHTML;
  }
  function nowTime() {
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    var ampm = h >= 12 ? "PM" : "AM";
    h = h % 12; if (h === 0) h = 12;
    return h + ":" + (m < 10 ? "0" : "") + m + " " + ampm;
  }
  function priorityPillClass(p) {
    var t = (p || "").toString().toLowerCase();
    if (t.indexOf("1") !== -1 || t.indexOf("critical") !== -1) return "p1";
    if (t.indexOf("2") !== -1 || t.indexOf("high") !== -1) return "p2";
    return "progress";
  }
  function statePillClass(s) {
    var t = (s || "").toString().toLowerCase();
    if (t.indexOf("complet") !== -1 || t.indexOf("success") !== -1 || t.indexOf("closed") !== -1 || t.indexOf("implement") !== -1) return "done";
    if (t.indexOf("fail") !== -1) return "p1";
    return "progress";
  }
  function setRoute(busy) {
    var badge = document.getElementById("routeBadge");
    var text = document.getElementById("routeBadgeText");
    if (busy) { badge.className = "route-indicator langgraph"; text.textContent = "Processing…"; }
    else { badge.className = "route-indicator mcp"; text.textContent = "Ready"; }
  }
  function buildIncidentCard() {
    var inc = contextSummary.incident;
    var card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<div class="card-header"><span class="card-id">' + esc(contextSummary.incidentId) + '</span><span class="pill ' + statePillClass(inc.state) + '">' + esc(inc.state || "Unknown") + '</span></div>' +
      '<div class="card-body"><div class="card-desc">' + esc(inc.desc) + '</div><div class="field-grid">' +
        '<div><div class="field-label">Priority</div><div class="field-value"><span class="pill ' + priorityPillClass(inc.prio) + '">' + esc(inc.prio || "N/A") + '</span></div></div>' +
        '<div><div class="field-label">Assigned To</div><div class="field-value">' + esc(inc.assignedTo) + '</div></div>' +
        '<div><div class="field-label">Assignment Group</div><div class="field-value">' + esc(inc.group || "N/A") + '</div></div>' +
        '<div><div class="field-label">App</div><div class="field-value">' + esc(inc.app || "N/A") + '</div></div>' +
      '</div></div>';
    return card;
  }
  function buildChangeCard(c) {
    var card = document.createElement("div");
    card.className = "card";
    var impactedHtml = "None listed";
    if (c.impactedCis && c.impactedCis.length) {
      impactedHtml = c.impactedCis.map(function (ci) {
        var supp = (ci.suppressionRequestNumber && ci.suppressionRequestNumber !== "N/A") ? ("Ticket " + ci.suppressionRequestNumber) : "no suppression request raised";
        return esc(ci.ciName) + ": " + esc(ci.suppressionStatus) + " (" + esc(supp) + ")";
      }).join("<br>");
    }
    card.innerHTML =
      '<div class="card-header"><span class="card-id">' + esc(c.changeNumber) + '</span><span class="pill ' + statePillClass(c.status) + '">' + esc(c.status || "Unknown") + '</span></div>' +
      '<div class="card-body"><div class="field-grid">' +
        '<div><div class="field-label">Submitter</div><div class="field-value">' + esc(c.submitter || "N/A") + '</div></div>' +
        '<div><div class="field-label">Coordinator</div><div class="field-value">' + esc(c.changeCoordinator || "N/A") + '</div></div>' +
        '<div><div class="field-label">Start</div><div class="field-value">' + esc(c.startTime || "N/A") + '</div></div>' +
        '<div><div class="field-label">End</div><div class="field-value">' + esc(c.endTime || "N/A") + '</div></div>' +
      '</div><div style="margin-top:14px;"><div class="field-label">Impacted Servers</div><div class="field-value" style="font-weight:400; line-height:1.7;">' + impactedHtml + '</div></div></div>';
    return card;
  }
  function buildAssetsCard() {
    var assets = contextSummary.assets || [];
    var card = document.createElement("div");
    card.className = "card";
    var rows = assets.map(function (ci) {
      var d = ci.fullDetails;
      var line = d ? (esc(d.name) + " — " + esc(d.manufacturer || "") + " " + esc(d.modelId || "") + ", " + esc(d.operatingSystem || "N/A")) : esc(ci.name);
      return '<div style="padding:8px 0; border-bottom:1px solid var(--border); font-size:12px;">' + line + '</div>';
    }).join("");
    card.innerHTML = '<div class="card-header"><span class="card-id">Asset Inventory</span></div><div class="card-body" style="padding-top:4px;">' + (rows || '<div class="field-value" style="font-weight:400;">No asset details loaded.</div>') + '</div>';
    return card;
  }
  function buildEvidenceChip() {
    var ev = contextSummary.evidence;
    var chip = document.createElement("div");
    chip.className = "tool-chip";
    chip.innerHTML = '<span class="dot"></span> Technical evidence (' + esc(ev.assetName || "no asset") + ') &middot; ' + esc((ev.tabs || []).join(", "));
    return chip;
  }
  function buildTrace() {
    var trace = document.createElement("div");
    trace.className = "trace";
    var steps = ["Assembling context"];
    (contextSummary.included || []).forEach(function (s) { steps.push("Reviewed " + s.toLowerCase()); });
    steps.push("Generating response");
    trace.innerHTML = steps.map(function (s) {
      return '<div class="trace-step"><span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></span><span class="label">' + esc(s) + '</span></div>';
    }).join("");
    return trace;
  }
  function addExchangeShell(userText) {
    var exch = document.createElement("div");
    exch.className = "exchange";
    var userRow = document.createElement("div");
    userRow.className = "msg-row user";
    var bubble = document.createElement("div");
    bubble.className = "bubble-user";
    bubble.textContent = userText;
    userRow.appendChild(bubble);
    exch.appendChild(userRow);
    var meta = document.createElement("div");
    meta.className = "msg-meta";
    meta.textContent = nowTime();
    exch.appendChild(meta);
    var block = document.createElement("div");
    block.className = "assistant-block";
    exch.appendChild(block);
    logEl.appendChild(exch);
    logEl.scrollTop = logEl.scrollHeight;
    return block;
  }
  function addThinkingChip(block) {
    var chip = document.createElement("div");
    chip.className = "thinking-chip";
    chip.innerHTML = '<span class="pulse"></span>Thinking…';
    block.appendChild(chip);
    logEl.scrollTop = logEl.scrollHeight;
    return chip;
  }
  var feedbackCounter = 0;
  function getCookie(name) {
    var match = document.cookie.match("(^|;\\s*)" + name + "=([^;]*)");
    return match ? decodeURIComponent(match[2]) : null;
  }
  var csrfBootstrapPromise = null;
  function ensureCsrfCookie() {
    if (!csrfBootstrapPromise) {
      csrfBootstrapPromise = fetch(CSRF_BOOTSTRAP_URL, { credentials: "same-origin" }).catch(function (e) { console.error("CSRF bootstrap failed", e); });
    }
    return csrfBootstrapPromise;
  }
  function csrfHeaders(extra) {
    var headers = {};
    for (var k in extra) headers[k] = extra[k];
    var token = getCookie("csrftoken");
    if (token) headers["X-CSRFToken"] = token;
    return headers;
  }
  ensureCsrfCookie();
  function submitFeedback(msgId, feedback, text) {
    if (DEMO_MODE || !FEEDBACK_URL) { console.log("[demo] feedback recorded", msgId, feedback); return; }
    ensureCsrfCookie().then(function () {
      fetch(FEEDBACK_URL, {
        method: "POST",
        credentials: "same-origin",
        headers: csrfHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ message_id: msgId, feedback: feedback, message: text })
      }).catch(function (e) { console.error("feedback submit failed", e); });
    });
  }
  function addStreamingReplyCard(block) {
    var card = document.createElement("div");
    card.className = "card";
    var msgId = "msg-" + (feedbackCounter++);
    card.innerHTML =
      '<div class="card-body">' +
      '<div class="field-value" style="font-weight:400; line-height:1.7; white-space:pre-wrap;"></div>' +
      '<div class="fb-row">' +
        '<span style="font-size:11px; color:var(--text-sec);">Was this helpful?</span>' +
        '<button class="fb-btn" data-fb="like" title="Helpful"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M7 22V11M2 13v7a2 2 0 002 2h12.9a2 2 0 002-1.7l1.4-9A2 2 0 0018.3 9H14V4a2 2 0 00-2-2l-3 7v13"/></svg></button>' +
        '<button class="fb-btn" data-fb="dislike" title="Not helpful"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M17 2v11M22 11V4a2 2 0 00-2-2H7.1a2 2 0 00-2 1.7l-1.4 9A2 2 0 005.7 15H10v5a2 2 0 002 2l3-7V2"/></svg></button>' +
      '</div></div>';
    var textEl = card.querySelector(".field-value");
    var latestText = "";
    var likeBtn = card.querySelector('[data-fb="like"]');
    var dislikeBtn = card.querySelector('[data-fb="dislike"]');
    var current = null;
    function applyState() {
      likeBtn.className = "fb-btn" + (current === "like" ? " active-like" : "");
      dislikeBtn.className = "fb-btn" + (current === "dislike" ? " active-dislike" : "");
    }
    likeBtn.addEventListener("click", function () { current = current === "like" ? null : "like"; applyState(); submitFeedback(msgId, current, latestText); });
    dislikeBtn.addEventListener("click", function () { current = current === "dislike" ? null : "dislike"; applyState(); submitFeedback(msgId, current, latestText); });
    block.appendChild(card);
    logEl.scrollTop = logEl.scrollHeight;
    return {
      update: function (text) { latestText = text; textEl.textContent = text; logEl.scrollTop = logEl.scrollHeight; }
    };
  }
  var DEMO_REPLIES = [
    "Based on the context shared, I would start by confirming whether the change window overlapped with the alert timestamps — that is the most common correlation I see in similar cases.",
    "Have you checked whether the suppression request (if any) was actually active during the incident window? A pending suppression would not have muted alerts.",
    "Given the asset details, I would also check recent patch history — if the last patch was applied close to the incident time, that is worth ruling in or out.",
    "It might help to compare the current resource averages against the historical baseline once more — a sustained deviation post-change is a strong signal.",
    "If none of the above pans out, escalating to the assignment group with this full context bundle is a reasonable next step."
  ];
  var demoReplyIndex = 0;
  async function getAssistantReply(userText, onChunk) {
    if (DEMO_MODE || !CHAT_URL) {
      var reply = DEMO_REPLIES[demoReplyIndex % DEMO_REPLIES.length];
      demoReplyIndex++;
      var words = reply.split(" ");
      var acc = "";
      for (var i = 0; i < words.length; i++) {
        await new Promise(function (r) { setTimeout(r, 35); });
        acc += (i > 0 ? " " : "") + words[i];
        onChunk(acc);
      }
      return reply;
    }
    await ensureCsrfCookie();
    var res = await fetch(CHAT_URL, {
      method: "POST",
      credentials: "same-origin",
      headers: csrfHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ message: userText, history: chatHistory })
    });
    if (!res.ok || !res.body) throw new Error("Assistant request failed (HTTP " + res.status + ")");
    var reader = res.body.getReader();
    var decoder = new TextDecoder();
    var acc2 = "";
    while (true) {
      var chunk = await reader.read();
      if (chunk.done) break;
      acc2 += decoder.decode(chunk.value, { stream: true });
      onChunk(acc2);
    }
    return acc2 || "No response received.";
  }
  function renderInitialExchange() {
    var openerText = "Continue investigating " + (contextSummary.incidentId || "this incident");
    var block = addExchangeShell(openerText);
    if (contextSummary.included && contextSummary.included.length) {
      var chip = document.createElement("div");
      chip.className = "tool-chip";
      chip.innerHTML = '<span class="dot"></span> Context assembled &middot; ' + esc(contextSummary.included.join(", "));
      block.appendChild(chip);
    }
    if (contextSummary.incident) block.appendChild(buildIncidentCard());
    if (contextSummary.changes) {
      if (contextSummary.changes.length) {
        contextSummary.changes.forEach(function (c) { block.appendChild(buildChangeCard(c)); });
      } else {
        var noChg = document.createElement("div");
        noChg.className = "card";
        noChg.innerHTML = '<div class="card-body"><div class="field-value" style="font-weight:400;">No linked change for this incident.</div></div>';
        block.appendChild(noChg);
      }
    }
    if (contextSummary.assets && contextSummary.assets.length) block.appendChild(buildAssetsCard());
    if (contextSummary.evidence) block.appendChild(buildEvidenceChip());
    block.appendChild(buildTrace());
    setRoute(true);
    var thinking = addThinkingChip(block);
    var replyCard = null;
    getAssistantReply(initialPrompt, function (partial) {
      if (!replyCard) { thinking.remove(); replyCard = addStreamingReplyCard(block); }
      replyCard.update(partial);
    }).then(function (reply) {
      chatHistory.push({ role: "user", content: initialPrompt });
      chatHistory.push({ role: "assistant", content: reply });
      setRoute(false);
    }).catch(function (err) {
      thinking.remove();
      if (!replyCard) replyCard = addStreamingReplyCard(block);
      replyCard.update("Failed to reach the AI assistant: " + err.message);
      setRoute(false);
    });
  }
  function send(text) {
    var block = addExchangeShell(text);
    setRoute(true);
    var thinking = addThinkingChip(block);
    var replyCard = null;
    getAssistantReply(text, function (partial) {
      if (!replyCard) { thinking.remove(); replyCard = addStreamingReplyCard(block); }
      replyCard.update(partial);
    }).then(function (reply) {
      chatHistory.push({ role: "user", content: text });
      chatHistory.push({ role: "assistant", content: reply });
      setRoute(false);
    }).catch(function (err) {
      thinking.remove();
      if (!replyCard) replyCard = addStreamingReplyCard(block);
      replyCard.update("Failed to reach the AI assistant: " + err.message);
      setRoute(false);
    });
  }
  function askSuggestion(el) {
    send(el.textContent);
  }
  renderInitialExchange();
  document.getElementById("chatForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("chatInput");
    var text = input.value.trim();
    if (!text) return;
    input.value = "";
    send(text);
  });
</script>
</body>
</html>
