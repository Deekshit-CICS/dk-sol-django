<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOC Navbar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --apple-bg: #f5f5f7;
            --glass: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(255, 255, 255, 0.9);
            --blue: #007aff;
            --text-main: #1d1d1f;
            --text-sec: #86868b;
        }

        body {
            background-color: var(--apple-bg);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            color: var(--text-main);
        }

        .navbar {
            background: rgba(245, 245, 247, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            padding: 12px 0;
            z-index: 1030;
        }

        .user-profile-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(0, 0, 0, 0.08);
            transition: opacity 0.2s;
        }
        .user-profile-circle:hover { opacity: 0.8; }

        .dropdown-menu {
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 8px;
            min-width: 210px;
            margin-top: 12px !important;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1) !important;
        }

        .dropdown-item {
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 0.9rem;
            color: var(--text-main);
        }
        .dropdown-item:hover {
            background: var(--apple-bg);
            color: var(--blue);
        }
    </style>
</head>
<body>

<nav class="navbar sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand" href="#">
            <i class="bi bi-cpu-fill me-2 text-primary"></i> GOC Toolkit
        </a>
        <div class="d-flex align-items-center">
            <span class="text-secondary small fw-medium d-none d-md-block me-3">Global Operation Center</span>
            <div class="dropdown">
                <a href="#" class="d-block" id="profileMenu" data-bs-toggle="dropdown" aria-expanded="false">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=007aff&color=fff"
                         class="user-profile-circle" alt="User Profile">
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="profileMenu">
                    <li><h6 class="dropdown-header">User Controls</h6></li>
                    <li>
                        <a class="dropdown-item" href="#">
                            <i class="bi bi-person-gear me-2"></i> User Settings
                        </a>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <a class="dropdown-item text-danger" href="#">
                            <i class="bi bi-power me-2"></i> Logoff
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
