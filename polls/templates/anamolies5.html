<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TowerCommand Nexus | Enterprise AI Ops</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root { 
            --apple-blue: #0071e3; 
            --apple-red: #ff3b30; 
            --apple-gray: #86868b;
            --glass-bg: rgba(255, 255, 255, 0.8);
        }
        
        body { 
            background: #f5f5f7; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1d1d1f; 
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 24px;
            transition: all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
            height: 100%;
        }

        .glass-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.06); 
        }

        .status-pill { 
            font-size: 0.65rem; 
            font-weight: 700; 
            padding: 4px 12px; 
            border-radius: 20px; 
            text-transform: uppercase; 
        }

        .action-btn { 
            width: 100%; 
            border-radius: 14px; 
            font-weight: 600; 
            font-size: 0.75rem; 
            padding: 12px; 
            transition: 0.3s; 
            text-align: center;
            border: none;
        }

        .bg-planned { background: #e8f2ff; color: #0071e3; border: 1px solid #0071e3; }
        .bg-critical { background: var(--apple-red); color: white; cursor: pointer; }
        .bg-stable { background: #f0f0f2; color: var(--apple-gray); cursor: default; }

        /* Agentic AI Terminal */
        .agent-terminal {
            background: #1c1c1e;
            color: #f5f5f7;
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.7rem;
            padding: 15px;
            border-radius: 16px;
            height: 150px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .log-container {
            max-height: 250px;
            overflow-y: auto;
        }

        .chart-container { height: 100px; position: relative; }
    </style>
</head>
<body class="py-5">

<div class="container-fluid px-lg-5">
    <header class="row mb-5 align-items-end">
        <div class="col-md-7">
            <h1 class="display-6 fw-bold mb-1">Tower<span class="text-primary">Nexus</span></h1>
            <p class="text-muted mb-0">Cross-Tower Anomaly Detection & ServiceNow Change Correlation</p>
        </div>
        <div class="col-md-5 d-flex justify-content-md-end mt-3 mt-md-0">
            <div class="glass-card px-4 py-2 me-3 d-flex align-items-center">
                <i class="bi bi-arrow-repeat text-primary me-2 spin-icon"></i>
                <div>
                    <div class="small fw-bold text-muted" style="font-size: 0.6rem;">SERVICENOW SYNC</div>
                    <div class="small fw-semibold">CHG-99281 Active</div>
                </div>
            </div>
            <div class="glass-card px-4 py-2 d-flex align-items-center border-success bg-opacity-10 bg-success">
                <div class="rounded-circle bg-success me-2" style="width: 8px; height: 8px;"></div>
                <div class="small fw-bold text-success uppercase" style="font-size: 0.65rem;">ELASTIC ML: NOMINAL</div>
            </div>
        </div>
    </header>

    <div class="row g-4" id="main-grid">
        </div>

    <div class="row mt-5">
        <div class="col-lg-8">
            <div class="glass-card p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="h6 fw-bold text-uppercase text-muted m-0" style="letter-spacing: 0.1em;">Agentic AI Reasoning Feed</h3>
                    <span class="status-pill bg-dark text-white">Autonomous Mode</span>
                </div>
                <div class="agent-terminal" id="agent-terminal">
                    <div class="text-info">> [System] Ready for Agentic Remediation...</div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="glass-card p-4">
                <h3 class="h6 fw-bold text-uppercase text-muted mb-4" style="letter-spacing: 0.1em;">Correlation Log</h3>
                <div id="event-log" class="log-container small fw-medium">
                    </div>
            </div>
        </div>
    </div>
</div>

<script>
    const TOWERS = [
        { id: 'unix', name: 'UNIX/Linux', icon: 'bi-server', metric: 'CPU Behavior', snow_chk: true },
        { id: 'win', name: 'Windows Srv', icon: 'bi-display', metric: 'Memory Pattern', snow_chk: false },
        { id: 'db', name: 'Database Ops', icon: 'bi-database', metric: 'I/O Latency', snow_chk: true },
        { id: 'mw', name: 'Middleware', icon: 'bi-layers', metric: 'JVM GC Drift', snow_chk: false },
        { id: 'st', name: 'Storage SAN', icon: 'bi-hdd-network', metric: 'R/W Entropy', snow_chk: false },
        { id: 'bk', name: 'Cloud Backup', icon: 'bi-shield-check', metric: 'Dedupe Ratio', snow_chk: false }
    ];

    const charts = {};

    function init() {
        const grid = document.getElementById('main-grid');
        TOWERS.forEach(t => {
            const col = document.createElement('div');
            col.className = 'col-md-6 col-lg-4';
            col.innerHTML = `
                <div id="card-${t.id}" class="glass-card p-4 d-flex flex-column justify-content-between">
                    <div>
                        <div class="d-flex justify-content-between align-items-start mb-4">
                            <div class="p-3 bg-light rounded-4"><i class="bi ${t.icon} h5 text-primary"></i></div>
                            <span id="score-${t.id}" class="status-pill bg-light text-muted">0.0</span>
                        </div>
                        <h3 class="h5 fw-bold mb-1">${t.name}</h3>
                        <div class="small fw-bold text-muted text-uppercase mb-4" style="font-size: 0.65rem; letter-spacing: 0.05em;">${t.metric}</div>
                        
                        <div id="correlation-${t.id}" class="rounded-4 p-3 mb-4 bg-light bg-opacity-50 border">
                            <div class="d-flex align-items-center mb-2">
                                <i class="bi bi-link-45deg text-primary me-2"></i>
                                <span class="small fw-bold text-muted text-uppercase" style="font-size: 0.6rem;">SNOW Correlation</span>
                            </div>
                            <div id="snow-status-${t.id}" class="small fw-medium text-muted fst-italic">Syncing metadata...</div>
                        </div>
                    </div>

                    <div class="chart-container mb-4">
                        <canvas id="chart-${t.id}"></canvas>
                    </div>

                    <div id="action-zone-${t.id}">
                        <button class="action-btn bg-stable">SYSTEM STABLE</button>
                    </div>
                </div>
            `;
            grid.appendChild(col);
            setupChart(t.id);
        });
        syncLoop();
    }

    function setupChart(id) {
        const ctx = document.getElementById(`chart-${id}`).getContext('2d');
        charts[id] = new Chart(ctx, {
            type: 'line',
            data: { labels: Array(12).fill(''), datasets: [{ data: Array(12).fill(0), borderColor: '#0071e3', borderWidth: 2, pointRadius: 0, tension: 0.4 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false, min: 0, max: 100 } } }
        });
    }

    function syncLoop() {
        TOWERS.forEach(t => {
            const isAnomaly = Math.random() > 0.88;
            const score = isAnomaly ? (Math.random() * 40 + 60) : (Math.random() * 8);
            
            const scoreEl = document.getElementById(`score-${t.id}`);
            const snowEl = document.getElementById(`snow-status-${t.id}`);
            const actionZone = document.getElementById(`action-zone-${t.id}`);
            const card = document.getElementById(`card-${t.id}`);

            scoreEl.innerText = score.toFixed(1);

            if (score > 75) {
                const hasTicket = t.snow_chk && isAnomaly; 
                
                if (hasTicket) {
                    snowEl.innerHTML = `<span class="text-primary fw-bold">Planned: CHG-88210</span>`;
                    actionZone.innerHTML = `<button class="action-btn bg-planned">VIEW CHANGE ORDER</button>`;
                    card.style.borderColor = "#0071e3";
                    logEvent(`[SNOW] Suppressed anomaly for ${t.name}. Matched CHG-88210.`, 'text-primary');
                } else {
                    snowEl.innerHTML = `<span class="text-danger fw-bold">Unplanned Anomaly</span>`;
                    actionZone.innerHTML = `<button onclick="triggerAgent('${t.id}')" class="action-btn bg-critical shadow-sm">RUN AGENTIC FIX</button>`;
                    card.style.borderColor = "#ff3b30";
                    logEvent(`[CRITICAL] Alert on ${t.name}. No ServiceNow context.`, 'text-danger');
                }
            } else {
                snowEl.innerText = "No maintenance found.";
                actionZone.innerHTML = `<button class="action-btn bg-stable">SYSTEM STABLE</button>`;
                card.style.borderColor = "rgba(0,0,0,0.08)";
            }

            const chart = charts[t.id];
            chart.data.datasets[0].data.shift();
            chart.data.datasets[0].data.push(score);
            chart.update('none');
        });
        setTimeout(syncLoop, 5000);
    }

    function logEvent(msg, colorClass) {
        const log = document.getElementById('event-log');
        const entry = document.createElement('div');
        entry.className = `p-2 border-bottom d-flex justify-content-between ${colorClass}`;
        entry.innerHTML = `<span>${msg}</span><span class="text-muted small">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>`;
        log.prepend(entry);
    }

    function triggerAgent(id) {
        const term = document.getElementById('agent-terminal');
        const tower = TOWERS.find(t => t.id === id);
        
        const steps = [
            `> Initiating Root Cause Analysis for ${tower.name}...`,
            `> Analyzing metric: ${tower.metric}...`,
            `> Reasoning: Behavioral drift suggests resource contention.`,
            `> Executing Tool: Ansible_Restart_Service...`,
            `> [Success] Remediation applied. Monitoring for recovery.`
        ];

        steps.forEach((step, i) => {
            setTimeout(() => {
                const div = document.createElement('div');
                div.className = i === 4 ? 'text-success fw-bold' : 'text-light opacity-75';
                div.innerText = step;
                term.appendChild(div);
                term.scrollTop = term.scrollHeight;
            }, i * 800);
        });
    }

    init();
</script>

<style>
    .spin-icon { animation: rotation 2s infinite linear; }
    @keyframes rotation { from { transform: rotate(0deg); } to { transform: rotate(359deg); } }
</style>

</body>
</html>
